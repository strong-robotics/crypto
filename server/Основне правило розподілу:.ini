Основне правило розподілу:
ARCHIVE_MIN_ITERATIONS = 1000 — ключовий поріг:
Якщо токен прожив ≥ 1000 ітерацій → архівується в tokens_history
Якщо токен прожив < 1000 ітерацій → переміщується в bad таблиці (bad_tokens)
надо теперь:
Якщо токен прожив ≥ 1 час та 25хв → архівується в tokens_history
Якщо токен прожив < 1 час та 25хв → переміщується в bad таблиці (bad_tokens)


Конкретні значення для кожного критерію:

Frozen Price (заморожена ціна):
120 секунд послідовно однакова ціна (FROZEN_PRICE_CONSEC_SEC = 120)
Точність порівняння: різниця <= 1e-10
≥ 1000 ітерацій → архів, < 1000 ітерацій → bad таблиця

Zero Tail (нульовий хвіст):
120 секунд послідовних нулів (ZERO_TAIL_CONSEC_SEC = 120)
Або fill_ratio <= 0.40 при віці >= 180 секунд
≥ 1000 ітерацій → архів, < 1000 ітерацій → bad таблиця

No Price (без ціни):
Вік >= 730 секунд (PRICE_CORRIDOR_PRE_END = 730)
≥ 1000 ітерацій → архів, < 1000 ітерацій → bad таблиця

No Median (без медіани):
Після 50 ітерацій (MEDIAN_MIN_ITERATIONS = 50)
≥ 1000 ітерацій → архів, < 1000 ітерацій → bad таблиця

Low Holders (мало холдерів):
Після 500 ітерацій (CLEANER_LOW_HOLDER_ITER_THRESHOLD = 500)
Менше 300 холдерів (CLEANER_LOW_HOLDER_MIN_COUNT = 300)
≥ 1000 ітерацій → архів, < 1000 ітерацій → bad таблиця

Bad Pattern / Bad Decision:
Після 14400 секунд (4 години) (BAD_PATTERN_HISTORY_READY_ITERS = 14400)
≥ 1000 ітерацій → архів, < 1000 ітерацій → bad таблиця
